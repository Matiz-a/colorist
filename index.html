<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorímetro LAB WebGL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="ui-container">
        <h2>Colorímetro L*a*b*</h2>
        
        <div class="panel">
            <h3>Color 1 (Referencia)</h3>
            <div class="inputs-row">
                <label>L* <input type="number" id="c1-L" value="50.0" step="0.1"></label>
                <label>a* <input type="number" id="c1-a" value="0.0" step="0.1"></label>
                <label>b* <input type="number" id="c1-b" value="0.0" step="0.1"></label>
            </div>
            <div class="swatch-row">
                <div id="swatch1" class="swatch"></div>
                <input type="text" id="hex1" readonly>
            </div>
        </div>

        <div class="panel">
            <h3>Color 2 (Muestra)</h3>
            
            <div class="slider-group">
                <span>Lightness</span>
                <input type="range" id="sl-L" min="0" max="100" step="0.1" value="75.0">
                <input type="number" id="c2-L" value="75.0" step="0.1">
            </div>
            
            <div class="slider-group">
                <span>a* (Verde-Rojo)</span>
                <input type="range" id="sl-a" min="-128" max="128" step="0.1" value="60.0">
                <input type="number" id="c2-a" value="60.0" step="0.1">
            </div>
            
            <div class="slider-group">
                <span>b* (Azul-Amarillo)</span>
                <input type="range" id="sl-b" min="-128" max="128" step="0.1" value="-60.0">
                <input type="number" id="c2-b" value="-60.0" step="0.1">
            </div>

            <div class="swatch-row">
                <div id="swatch2" class="swatch"></div>
                <input type="text" id="hex2" readonly>
            </div>
        </div>

        <div id="delta-panel">
            <p id="txt-deltas">Calculando...</p>
        </div>

        <div id="export-panel" class="panel">
            <h3>Exportar Imagenes</h3>
            <div class="btn-group">
                <button id="btn-save-3d" class="btn-blue">Guardar Imagen Escena 3D</button>
                <button id="btn-export-txt" class="btn-green">Exportar Datos (txt)</button>
            </div>
            <div class="btn-group">
                <button id="btn-save-c1-circle">Guardar Color 1 Circular</button>
                <button id="btn-save-c2-circle">Guardar Color 2 Circular</button>
            </div>
            <div class="btn-group">
                <button id="btn-save-together-square">Guardar Juntos Cuadrado</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
